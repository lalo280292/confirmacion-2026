<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <title>Mi confirmación</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="admin.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .entrar { animation: entrar .35s ease-out both; }
        @keyframes entrar { from { opacity: 0; transform: translateY(12px) scale(.98); } to { opacity: 1; transform: none; } }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">

    <!-- BARRA SUPERIOR -->
    <header class="bg-slate-900 text-white sticky top-0 z-30 shadow-lg">
        <div class="max-w-xl mx-auto px-4 py-3 flex items-center gap-3">
            <div class="h-10 w-10 rounded-xl bg-white/10 grid place-items-center shrink-0">
                <i class="ph-fill ph-ticket text-2xl"></i>
            </div>
            <div class="min-w-0">
                <p class="font-extrabold text-lg leading-tight truncate">Mi confirmación</p>
                <p class="text-xs text-slate-400 leading-tight">Datos de tu pase de acceso</p>
            </div>
        </div>
    </header>

    <main class="max-w-xl mx-auto p-4 space-y-4 pb-16">

        <!-- RESULTADO -->
        <section id="resultado"></section>

        <!-- PIE -->
        <div class="text-center pt-2">
            <button id="btnRefresh" onclick="recargarActual()" class="hidden inline-flex items-center gap-2 text-slate-500 hover:text-indigo-600 text-base font-semibold py-2 px-4">
                <i id="iconRefresh" class="ph ph-arrows-clockwise text-xl"></i>
                <span id="textRefresh">Actualizar datos</span>
            </button>
        </div>
    </main>

    <script>
        // Página que se abre al escanear el QR del pase (paseqr.html): escaner.html?id=XXXXX
        // Solo muestra los datos de la confirmación, en letra grande para leerlos rápido.
        const parametros = new URLSearchParams(location.search);
        let actual = null; // datos del código que se está viendo

        document.addEventListener('DOMContentLoaded', () => {
            const id = parametros.get('id');
            if (id) cargar(id);
            else pintarError('No se especificó un código en el enlace.', 'Abre esta página desde tu pase de acceso.');
        });

        // ===== CARGA DE DATOS =====

        function recargarActual() {
            if (actual) cargar(actual.id);
        }

        async function cargar(id) {
            document.getElementById('btnRefresh').classList.remove('hidden');
            estadoCargando(true, 'Actualizar datos');
            pintarCargando(id);
            try {
                const res = await fetch(`api.php?accion=escaneo&id=${encodeURIComponent(id)}&t=${Date.now()}`, { cache: 'no-store' });
                const data = await res.json().catch(() => ({ ok: false, error: 'Error de conexión.' }));
                if (!data.ok) {
                    actual = null;
                    if (res.status === 404) pintarError('Código no encontrado', `El código ${String(id).toUpperCase()} no existe en la lista de invitados.`);
                    else throw new Error(data.error);
                    return;
                }
                actual = data;
                pintarResultado(data);
            } catch (error) {
                console.error(error);
                pintarError('No se pudo cargar', error.message || 'Revisa la conexión a internet.');
            } finally {
                estadoCargando(false, 'Actualizar datos');
            }
        }

        // ===== ESTADO DEL CÓDIGO =====

        function calcularEstado(d) {
            const conf = d.confirmacion;
            if (!conf) {
                return { color: 'orange', icono: 'ph-fill ph-question',
                    titulo: 'Sin confirmar', detalle: 'El código es válido, pero aún no se responde el formulario' };
            }
            if (conf.asistira !== 'Si') {
                return { color: 'rose', icono: 'ph-fill ph-x-circle',
                    titulo: 'No asistirá', detalle: 'Respondió que no podrá asistir' };
            }
            return { color: 'emerald', icono: 'ph-fill ph-check-circle',
                titulo: 'Asistencia confirmada', detalle: '¡Te esperamos!' };
        }

        const COLORES = {
            emerald: 'bg-gradient-to-br from-emerald-500 to-green-600',
            orange:  'bg-gradient-to-br from-orange-400 to-amber-500',
            rose:    'bg-gradient-to-br from-rose-500 to-red-600',
        };

        // Los nombres se escriben libres: uno por renglón o separados por comas
        function listaNombres(texto) {
            return String(texto || '').split(/\r?\n|,|;/).map(n => n.trim()).filter(Boolean);
        }

        // ===== PINTAR =====

        function pintarResultado(d) {
            const est = calcularEstado(d);
            const conf = d.confirmacion;
            const inv = d.invitado || {};
            const asiste = conf && conf.asistira === 'Si';
            const fuente = asiste ? conf : inv;
            const nombre = conf ? conf.familia : (inv.nombre_visible || nombreVisible(inv));
            const mesa = (conf && conf.mesa) || inv.mesa || '';
            const personas = asiste ? num(conf.cantidad) : sumaPersonas(inv);
            const adu = num(fuente.adultos), ado = num(fuente.adolescentes), nin = num(fuente.ninos);
            const nombres = listaNombres(asiste ? conf.nombres : inv.nombres);

            const tile = (n, etiqueta, corta, clases) => `
                <div class="rounded-2xl ${clases} px-1 py-3 text-center min-w-0">
                    <p class="text-4xl sm:text-5xl font-black leading-none">${n}</p>
                    <p class="mt-1 text-xs sm:text-sm font-bold uppercase opacity-80"><span class="sm:hidden">${corta}</span><span class="hidden sm:inline">${etiqueta}</span></p>
                </div>`;
            const desglose = adu + ado + nin > 0 ? `
                <div class="grid grid-cols-3 gap-3">
                    ${tile(adu, adu === 1 ? 'Adulto' : 'Adultos', adu === 1 ? 'Adulto' : 'Adultos', 'bg-blue-50 text-blue-700')}
                    ${tile(ado, ado === 1 ? 'Adolescente' : 'Adolescentes', 'Adolesc.', 'bg-amber-50 text-amber-700')}
                    ${tile(nin, nin === 1 ? 'Niño' : 'Niños', nin === 1 ? 'Niño' : 'Niños', 'bg-green-50 text-green-700')}
                </div>` : '';

            document.getElementById('resultado').innerHTML = `
                <article class="entrar bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
                    <!-- Estado -->
                    <div class="${COLORES[est.color]} text-white px-5 pt-7 pb-6 text-center">
                        <div class="mx-auto h-20 w-20 rounded-full bg-white/20 grid place-items-center">
                            <i class="${est.icono} text-5xl"></i>
                        </div>
                        <h2 class="mt-3 text-3xl sm:text-4xl font-black tracking-tight">${esc(est.titulo)}</h2>
                        <p class="text-white/90 text-lg font-medium mt-1">${esc(est.detalle)}</p>
                    </div>

                    <div class="p-5 space-y-5">
                        <!-- Nombre -->
                        <div class="text-center">
                            <p class="text-sm uppercase tracking-widest font-bold text-slate-400">Invitación para</p>
                            <h3 class="text-3xl sm:text-4xl font-black text-slate-900 leading-tight break-words mt-1">${esc(nombre)}</h3>
                            <p class="mono mt-2 inline-block text-base font-bold text-slate-500 bg-slate-100 rounded-lg px-3 py-1 tracking-widest">${esc(d.id)}</p>
                        </div>

                        <!-- Mesa -->
                        <div class="rounded-3xl ${mesa ? 'bg-indigo-50 border-indigo-100' : 'bg-yellow-50 border-yellow-200'} border p-5 text-center">
                            <p class="text-base uppercase tracking-widest font-bold ${mesa ? 'text-indigo-400' : 'text-yellow-600'}">Mesa</p>
                            <p class="${mesa ? 'text-8xl text-indigo-700' : 'text-3xl text-yellow-700 py-2'} font-black leading-none mt-2 break-words">${mesa ? esc(mesa) : 'Sin asignar'}</p>
                        </div>

                        <!-- Personas -->
                        <div class="rounded-3xl bg-slate-50 border border-slate-200 p-5 space-y-4">
                            <div class="text-center">
                                <p class="text-base uppercase tracking-widest font-bold text-slate-400">${asiste ? 'Personas confirmadas' : 'Personas invitadas'}</p>
                                <p class="text-8xl font-black text-slate-800 leading-none mt-2">${personas || '—'}</p>
                            </div>
                            ${desglose}
                        </div>

                        ${nombres.length ? `
                        <div class="rounded-3xl bg-slate-50 border border-slate-200 p-5">
                            <p class="text-base uppercase tracking-widest font-bold text-slate-400 mb-3">Nombres</p>
                            <ul class="space-y-2">
                                ${nombres.map(n => `
                                <li class="flex items-start gap-3 text-xl sm:text-2xl font-semibold text-slate-800 break-words">
                                    <i class="ph-fill ph-user-circle text-slate-400 text-2xl sm:text-3xl shrink-0"></i>
                                    <span class="min-w-0">${esc(n)}</span>
                                </li>`).join('')}
                            </ul>
                        </div>` : ''}

                        ${conf ? `
                        <div class="text-center text-base text-slate-500 space-y-1">
                            <p><i class="ph ph-calendar-check"></i> Confirmó el <b class="text-slate-700">${esc(fechaLarga(conf.fecha, true))}</b></p>
                            ${conf.actualizado && conf.actualizado !== conf.fecha ? `<p class="text-sm">Última modificación: ${esc(fechaLarga(conf.actualizado, true))}</p>` : ''}
                        </div>` : ''}
                    </div>
                </article>`;
        }

        function pintarCargando(id) {
            document.getElementById('resultado').innerHTML = `
                <div class="bg-white rounded-3xl shadow-sm border border-slate-200 p-10 text-center text-slate-400 text-lg">
                    <i class="ph ph-spinner animate-spin text-5xl block mx-auto mb-3"></i>
                    Buscando <span class="mono font-bold text-slate-600">${esc(String(id).toUpperCase())}</span>...
                </div>`;
        }

        function pintarError(titulo, detalle) {
            document.getElementById('resultado').innerHTML = `
                <article class="entrar bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
                    <div class="${COLORES.rose} text-white px-5 py-8 text-center">
                        <div class="mx-auto h-20 w-20 rounded-full bg-white/20 grid place-items-center"><i class="ph-fill ph-prohibit text-5xl"></i></div>
                        <h2 class="mt-3 text-3xl font-black">${esc(titulo)}</h2>
                        <p class="text-white/90 text-lg mt-1">${esc(detalle)}</p>
                    </div>
                </article>`;
        }
    </script>
</body>
</html>
